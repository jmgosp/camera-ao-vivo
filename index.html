<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>SENDER // TRANSMISSÃO IMORTAL</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #0d1117; color: #c9d1d9; font-family: monospace; margin: 0; }
        #videoPreview { width: 90%; max-width: 400px; aspect-ratio: 16/9; background-color: #000; border: 1px solid #30363d; border-radius: 8px; margin-bottom: 20px; object-fit: contain; }
        #gravarBtn { width: 150px; height: 150px; border-radius: 50%; border: 4px solid #30363d; background-color: #21262d; color: #c9d1d9; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        #gravarBtn.gravando { background-color: #238636; color: white; border-color: #2ea043; box-shadow: 0 0 30px rgba(46, 160, 67, 0.3); }
        #status { margin-top: 20px; font-size: 12px; color: #8b949e; letter-spacing: 1px; }
    </style>
</head>
<body>
    <video id="videoPreview" autoplay muted playsinline></video>
    <button id="gravarBtn">ATIVAR<br>SISTEMA</button>
    <div id="status">STATUS: DISPONÍVEL</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCK_WxpjzW3wblhIjCGBJZXNlQ4YKM5IxQ", authDomain: "explana-ae7bb.firebaseapp.com", projectId: "explana-ae7bb", storageBucket: "explana-ae7bb.firebasestorage.app", messagingSenderId: "1036958420186", appId: "1:1036958420186:web:71f2c6658d0407d9a629e3" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const config = { iceServers: [ { urls: "stun:stun.l.google.com:19302" }, { urls: "turn:144.22.225.58:3478?transport=udp", username: "filho", credential: "monitor2026" }, { urls: "turn:144.22.225.58:3478?transport=tcp", username: "filho", credential: "monitor2026" } ] };

        let pc, localStream, roomId, isTransmitting = false;
        let currentFacingMode = "environment";
        let listenerPainel = null; // Para anular a escuta antiga e evitar conflitos

        async function iniciarTransmissao() {
            try {
                if (localStream) localStream.getTracks().forEach(t => t.stop());
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: currentFacingMode, width: {ideal: 1280}, height: {ideal: 720} }, 
                    audio: true 
                });
                
                document.getElementById('videoPreview').srcObject = localStream;
                document.getElementById('gravarBtn').classList.add('gravando');
                document.getElementById('gravarBtn').innerHTML = 'SISTEMA ON';
                isTransmitting = true;

                if (!roomId) {
                    const roomRef = doc(collection(db, "sessoes")); 
                    roomId = roomRef.id;
                    document.getElementById('status').innerText = `ID: ${roomId}`;
                    
                    onSnapshot(roomRef, async (s) => {
                        if (!s.exists()) return;
                        const data = s.data();
                        
                        // Painel solicitou reinicialização brutal (F5 na página)
                        if (isTransmitting && data.comando === 'reset') {
                            console.log("Reinicialização profunda acionada...");
                            gerarOferta();
                            return;
                        }

                        // Inversão da câmera
                        if (data.comando === 'flip') {
                            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
                            if (localStream) localStream.getTracks().forEach(t => t.stop());
                            localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
                            document.getElementById('videoPreview').srcObject = localStream;
                            gerarOferta(); 
                            return;
                        }

                        // Sincronização Segura: Só pega IPs depois que aceitar a autorização
                        if (data.answer && pc && pc.signalingState === "have-local-offer") {
                            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
                            
                            if (!listenerPainel) {
                                listenerPainel = onSnapshot(collection(roomRef, 'calleeCandidates'), snap => {
                                    snap.docChanges().forEach(async c => { 
                                        if (c.type === 'added' && pc && pc.remoteDescription) {
                                            try { await pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); } catch(e){}
                                        }
                                    });
                                });
                            }
                        }
                    });
                }
                gerarOferta();
            } catch (e) { document.getElementById('status').innerText = "ERRO: PERMISSÃO NEGADA"; }
        }

        async function gerarOferta() {
            if (pc) pc.close();
            if (listenerPainel) { listenerPainel(); listenerPainel = null; } // Reseta a escuta

            pc = new RTCPeerConnection(config);
            const roomRef = doc(db, "sessoes", roomId);

            // CORREÇÃO MESTRA: Busca e tritura todo o lixo velho escondido no Firebase
            const lixo1 = await getDocs(collection(roomRef, 'callerCandidates'));
            lixo1.forEach(d => deleteDoc(d.ref));
            const lixo2 = await getDocs(collection(roomRef, 'calleeCandidates'));
            lixo2.forEach(d => deleteDoc(d.ref));

            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            
            pc.onicecandidate = e => {
                if (e.candidate) setDoc(doc(collection(roomRef, 'callerCandidates')), e.candidate.toJSON());
            };
            
            const offer = await pc.createOffer(); 
            await pc.setLocalDescription(offer);
            
            // Grava a oferta zerando os rastros da conexão anterior
            await setDoc(roomRef, { 
                ativo: true, 
                nome: "CAMERA_01", 
                lastSeen: Date.now(), 
                offer: { type: offer.type, sdp: offer.sdp },
                answer: null,
                comando: null
            }, { merge: true });
        }

        setInterval(() => { 
            if(roomId && isTransmitting) updateDoc(doc(db, "sessoes", roomId), { lastSeen: Date.now() }); 
        }, 5000);

        document.getElementById('gravarBtn').addEventListener('click', iniciarTransmissao);
        window.addEventListener('beforeunload', () => { 
            isTransmitting = false; 
            if(roomId) deleteDoc(doc(db, "sessoes", roomId)); 
        });
    </script>
</body>
</html>
