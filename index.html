<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>CONTROLE // MONITORAMENTO PROFISSIONAL</title>
    <style>
        body { margin: 0; padding: 20px; background-color: #0a0a0a; color: #58a6ff; font-family: monospace; }
        .header { display: flex; justify-content: space-between; border-bottom: 2px solid #1f2328; padding-bottom: 15px; margin-bottom: 20px; }
        #cctvGrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 15px; max-width: 1600px; margin: 0 auto; }
        .monitor-box { background: #161b22; border: 1px solid #30363d; border-radius: 4px; overflow: hidden; display: flex; flex-direction: column; width: 100%; max-width: 500px; position: relative; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: contain; }
        .cam-info { background: #0d1117; padding: 10px; display: flex; justify-content: space-between; font-size: 10px; border-bottom: 1px solid #30363d; color: #8b949e; }
        .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 10px; background: #0d1117; }
        button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px; cursor: pointer; font-size: 9px; font-weight: bold; text-transform: uppercase; }
        .btn-recover { background: #1f6feb; color: white; border: none; padding: 12px 25px; font-size: 11px; cursor: pointer; border-radius: 4px; }
        .monitor-box:fullscreen { max-width: none; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div class="header">
        <h1>[ CONTROL_CENTER_V6 ]</h1>
        <button class="btn-recover" onclick="recuperacaoProfunda()">[ RECUPERAR TODAS AS SESSÕES ]</button>
    </div>
    <div id="cctvGrid"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, updateDoc, deleteDoc, setDoc, getDocs, deleteField } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyCK_WxpjzW3wblhIjCGBJZXNlQ4YKM5IxQ", authDomain: "explana-ae7bb.firebaseapp.com", projectId: "explana-ae7bb", storageBucket: "explana-ae7bb.firebasestorage.app", messagingSenderId: "1036958420186", appId: "1:1036958420186:web:71f2c6658d0407d9a629e3" };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const config = { iceServers: [ { urls: "stun:stun.l.google.com:19302" }, { urls: "turn:144.22.225.58:3478?transport=udp", username: "filho", credential: "monitor2026" }, { urls: "turn:144.22.225.58:3478?transport=tcp", username: "filho", credential: "monitor2026" } ] };
        
        const conexoesAtivas = {};

        // DEEP SCAN: Limpa os handshakes antigos para forçar as Babás a reconectarem [cite: 839, 906, 920, 923]
        window.recuperacaoProfunda = async () => {
            const snap = await getDocs(collection(db, "sessoes"));
            snap.forEach(async (d) => {
                await updateDoc(doc(db, "sessoes", d.id), { answer: deleteField(), calleeCandidates: deleteField() });
            });
        };

        onSnapshot(collection(db, "sessoes"), (snap) => {
            snap.docChanges().forEach(change => {
                const id = change.doc.id;
                const data = change.doc.data();
                if (change.type === 'added' || (change.type === 'modified' && data.offer && !conexoesAtivas[id])) {
                    criarMonitorUI(id, data);
                }
                if (change.type === 'removed') {
                    document.getElementById(`monitor-${id}`)?.remove();
                    if(conexoesAtivas[id]) conexoesAtivas[id].close();
                    delete conexoesAtivas[id];
                }
            });
        });

        async function criarMonitorUI(id, sessao) {
            if (document.getElementById(`monitor-${id}`)) return;
            const box = document.createElement('div');
            box.id = `monitor-${id}`; box.className = 'monitor-box';
            box.innerHTML = `
                <div class="cam-info"><span>${sessao.nome || 'CAMERA'}</span><span id="st-${id}">SYNC...</span></div>
                <div class="video-container"><video id="video-${id}" autoplay playsinline muted></video></div>
                <div class="controls">
                    <button onclick="alternarAudio('${id}')">ÁUDIO</button>
                    <button onclick="zoom('${id}')">ZOOM</button>
                    <button onclick="inverterRemoto('${id}')">INVERTER</button>
                    <button onclick="renomear('${id}')">RENOMEAR</button>
                    <button style="color:#f85149" onclick="apagar('${id}')">DERRUBAR</button>
                </div>`;
            document.getElementById('cctvGrid').appendChild(box);
            conectarWebRTC(id, sessao);
        }

        async function conectarWebRTC(id, sessao) {
            const pc = new RTCPeerConnection(config);
            conexoesAtivas[id] = pc;
            const stream = new MediaStream();
            document.getElementById(`video-${id}`).srcObject = stream;
            pc.ontrack = e => e.streams[0].getTracks().forEach(t => stream.addTrack(t));
            pc.onicecandidate = e => e.candidate && setDoc(doc(collection(db, "sessoes", id, 'calleeCandidates')), e.candidate.toJSON());
            pc.onconnectionstatechange = () => {
                const el = document.getElementById(`st-${id}`);
                if (el) el.innerText = pc.connectionState.toUpperCase();
            };
            await pc.setRemoteDescription(new RTCSessionDescription(sessao.offer));
            const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
            await updateDoc(doc(db, "sessoes", id), { answer: { type: ans.type, sdp: ans.sdp } });
            onSnapshot(collection(db, "sessoes", id, 'callerCandidates'), s => {
                s.docChanges().forEach(async c => { if (c.type === 'added' && pc.signalingState !== 'closed') await pc.addIceCandidate(new RTCIceCandidate(c.doc.data())); });
            });
        }

        window.inverterRemoto = async (id) => {
            await updateDoc(doc(db, "sessoes", id), { comando: 'flip', offer: deleteField(), answer: deleteField() });
        };
        window.zoom = id => { const el = document.getElementById(`monitor-${id}`); if (!document.fullscreenElement) el.requestFullscreen(); else document.exitFullscreen(); };
        window.alternarAudio = id => { const v = document.getElementById(`video-${id}`); v.muted = !v.muted; };
        window.renomear = id => { const n = prompt("Novo nome:"); if (n) updateDoc(doc(db, "sessoes", id), { nome: n }); };
        window.apagar = id => deleteDoc(doc(db, "sessoes", id));
    </script>
</body>
</html>
